<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>职业培训分镜工作台</title>
<style>
  :root{--bg:#0f172a;--panel:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
    --brand:#2563eb;--brand2:#1d4ed8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eff6ff;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#f1f5f9;color:var(--ink)}
  header{background:linear-gradient(120deg,#0f172a,#1e3a8a);color:#fff;padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.5px}
  header .sp{flex:1}
  select,input,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{width:100%;min-height:54px;resize:vertical}
  button{cursor:pointer;font:inherit;border:0;border-radius:8px;padding:7px 12px;background:var(--brand);color:#fff}
  button.ghost{background:#eef2ff;color:#3730a3}button.danger{background:#fee2e2;color:#b91c1c}
  button.small{padding:3px 9px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h3{font-size:13px;margin:12px 0 6px;color:#334155}
  .muted{color:var(--muted);font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .course-item{padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .course-item.active{border-color:var(--brand);background:var(--chip)}
  .chapter{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .chapter>div.hd{display:flex;gap:8px;align-items:center;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line)}
  .chapter .bd{padding:10px 12px}
  .seg{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:#fcfcfd;border-radius:0 8px 8px 0}
  .seg.lecture{border-color:#2563eb}.seg.demo{border-color:#d97706}.seg.exercise{border-color:#16a34a}
  .tag{font-size:11px;padding:1px 8px;border-radius:999px;background:#f1f5f9;color:#475569}
  .tag.lecture{background:#dbeafe;color:#1d4ed8}.tag.demo{background:#fef3c7;color:#92400e}.tag.exercise{background:#dcfce7;color:#166534}
  .tag.bad{background:#fee2e2;color:#b91c1c}.tag.ok{background:#dcfce7;color:#166534}.tag.warn{background:#ffedd5;color:#9a3412}
  .tag.pinned{background:#e0e7ff;color:#3730a3}.tag.follow{background:#ecfeff;color:#0e7490}
  .issue{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;margin:5px 0;font-size:13px}
  .issue.error{background:#fef2f2;border:1px solid #fecaca}.issue.warn{background:#fffbeb;border:1px solid #fde68a}
  .issue.ok{background:#f0fdf4;border:1px solid #bbf7d0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  code{background:#f1f5f9;padding:1px 5px;border-radius:5px;font-size:12px}
  .toast{position:fixed;right:18px;bottom:18px;max-width:420px;z-index:99}
  .toast div{padding:10px 14px;border-radius:10px;margin-top:8px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast .ok{background:#16a34a}.toast .err{background:#dc2626}.toast .info{background:#334155}
  .pill{font-size:11px;padding:1px 7px;border-radius:999px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:16px;padding:20px;width:min(760px,94vw);max-height:88vh;overflow:auto}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin:4px 0}
  .smalltxt{font-size:12px;color:var(--muted)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:#e2e8f0;color:#334155}.tabs button.on{background:var(--brand);color:#fff}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🎬 职业培训分镜工作台</h1>
  <span class="smalltxt" style="opacity:.8">目标 · 章节 · 台词 · 操作演示 · 练习提示 · 可预览课件包</span>
  <span class="sp"></span>
  <button class="small danger" onclick="leaveTeam()" title="办理当前身份离开团队">离开团队</button>
  <label class="smalltxt" style="color:#cbd5e1">当前身份
    <select id="userSel" style="min-width:150px"></select>
  </label>
</header>

<div class="wrap">
  <!-- 左：课程与资产 -->
  <div>
    <div class="card">
      <h2>课程
        <button class="small ghost" onclick="newCourse()">＋ 新建课程</button>
      </h2>
      <div id="courseList"><div class="muted">加载中…</div></div>
    </div>
    <div class="card">
      <h2>素材库（画面/字幕/说明 同源版本）</h2>
      <div class="row" style="margin-bottom:8px">
        <input id="assetTitle" placeholder="素材名称，如：数据导入录屏" style="flex:1"/>
        <button class="small" onclick="newAsset()">新建素材</button>
      </div>
      <div id="assetList" class="muted"></div>
    </div>
  </div>

  <!-- 右：主工作区 -->
  <div id="main"><div class="card muted">请选择或新建一门课程。</div></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
